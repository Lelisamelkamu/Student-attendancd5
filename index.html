<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Attendance Management System
    </title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <h1>
            📚 Student Attendance System
        </h1>

        <div class="top-buttons">

            <button
                class="dark-btn"
                onclick="toggleDarkMode()"
            >
                🌙 Dark Mode
            </button>

            <button
                class="dark-btn"
                onclick="exportCSV()"
            >
                📥 Export CSV
            </button>

        </div>

    </div>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="content">


        <!-- =========================
             STATISTICS
        ========================== -->

        <div class="stats">

            <div class="stat">

                <div>
                    👨‍🎓 Total Students
                </div>

                <h2 id="totalStudents">
                    0
                </h2>

            </div>


            <div class="stat">

                <div>
                    ✅ Present
                </div>

                <h2 id="presentCount">
                    0
                </h2>

            </div>


            <div class="stat">

                <div>
                    ❌ Absent
                </div>

                <h2 id="absentCount">
                    0
                </h2>

            </div>


            <div class="stat">

                <div>
                    📊 Attendance %
                </div>

                <h2 id="attendancePercent">
                    0%
                </h2>

            </div>

        </div>



        <!-- =========================
             STUDENT FORM
        ========================== -->

        <div class="form-section">


            <!-- Student ID -->

            <div class="form-group">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="e.g. STU001"
                >

            </div>


            <!-- Student Name -->

            <div class="form-group">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Full name"
                >

            </div>


            <!-- Status -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="Present">
                        Present
                    </option>

                    <option value="Absent">
                        Absent
                    </option>

                </select>

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button
                    class="btn-add"
                    onclick="addStudent()"
                >
                    ➕ Add Student
                </button>

                <button
                    class="btn-mark"
                    onclick="markAttendance()"
                >
                    ✔ Mark Attendance
                </button>

                <button
                    class="btn-clear"
                    onclick="clearFields()"
                >
                    Clear
                </button>

            </div>

        </div>



        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="🔎 Search by Student ID or Name..."
                oninput="renderTable()"
            >

        </div>



        <!-- =========================
             STUDENT TABLE
        ========================== -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Student ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                    <!-- Student records appear here -->

                </tbody>

            </table>

        </div>



        <!-- =========================
             EMPTY MESSAGE
        ========================== -->

        <div
            id="emptyMessage"
            class="empty"
        >

            No student records found.

        </div>


    </div>



    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">

        Student Attendance Management System

        <br>

        • Data saved automatically in browser

    </div>


</div>



<!-- =========================
     CONNECT JAVASCRIPT
========================== -->

<script src="script.js"></script>


</body>

</html>
