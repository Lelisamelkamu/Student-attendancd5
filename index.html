<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <style>
      <link rel="stylesheet" href="style.css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: #1e293b;
            color: white;
            padding: 22px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .content {
            padding: 25px 30px;
        }

        .form-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 180px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #3b82f6;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add {
            background: #16a34a;
            color: white;
        }
        .btn-add:hover { background: #15803d; }

        .btn-mark {
            background: #2563eb;
            color: white;
        }
        .btn-mark:hover { background: #1d4ed8; }

        .btn-clear {
            background: #64748b;
            color: white;
        }
        .btn-clear:hover { background: #475569; }

        .btn-delete {
            background: #dc2626;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            color: #334155;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status-present {
            color: #16a34a;
            font-weight: 600;
        }

        .status-absent {
            color: #dc2626;
            font-weight: 600;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Attendance System</h1>
        </div>

        <div class="content">
            <div class="form-section">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g. STU001">
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="studentName" placeholder="Student full name">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn-add" onclick="addStudent()">Add Student</button>
                    <button class="btn-mark" onclick="markAttendance()">Mark Attendance</button>
                    <button class="btn-clear" onclick="clearFields()">Clear</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Records here -->
                </tbody>
            </table>
            <div id="emptyMessage" class="empty" style="display: none;">
                No records yet. Add a student to get started.
            </div>
        </div>

        <div class="footer">
            Simple Attendance System • Data saved in browser
        </div>
    </div>

    <script>
        // Load data from localStorage
        let students = JSON.parse(localStorage.getItem("attendanceData")) || [];

        function saveData() {
            localStorage.setItem("attendanceData", JSON.stringify(students));
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            const emptyMsg = document.getElementById("emptyMessage");

            tbody.innerHTML = "";

            if (students.length === 0) {
                emptyMsg.style.display = "block";
                return;
            }

            emptyMsg.style.display = "none";

            students.forEach((student, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.date || "-"}</td>
                    <td class="${student.status === 'Present' ? 'status-present' : student.status === 'Absent' ? 'status-absent' : ''}">
                        ${student.status || "-"}
                    </td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent(${index})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function addStudent() {
            const id = document.getElementById("studentId").value.trim();
            const name = document.getElementById("studentName").value.trim();

            if (!id || !name) {
                alert("Student ID fi Name galchi!");
                return;
            }

            // Check if ID already exists
            if (students.some(s => s.id === id)) {
                alert("Student ID kun duraan jira!");
                return;
            }

            students.push({
                id: id,
                name: name,
                date: "",
                status: ""
            });

            saveData();
            renderTable();
            clearFields();
            alert("Student milkaa'inaan dabalamte!");
        }

        function markAttendance() {
            const id = document.getElementById("studentId").value.trim();
            const status = document.getElementById("status").value;

            if (!id) {
                alert("Student ID galchi!");
                return;
            }

            const student = students.find(s => s.id === id);

            if (!student) {
                alert("Student ID hin argamne!");
                return;
            }

            const today = new Date().toISOString().split("T")[0];
            student.date = today;
            student.status = status;

            saveData();
            renderTable();
            alert(`Attendance ${status} ta'ee mark godhame!`);
        }

        function deleteStudent(index) {
            if (confirm("Student kana delete gochuu barbaaddaa?")) {
                students.splice(index, 1);
                saveData();
                renderTable();
            }
        }

        function clearFields() {
            document.getElementById("studentId").value = "";
            document.getElementById("studentName").value = "";
            document.getElementById("status").value = "Present";
        }

        // Load table when page opens
        renderTable();
    </script>
  <script src="script.js"></script>
</body>
  </html>
