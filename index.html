<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f2f5;
            padding: 30px 15px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: #1e293b;
            color: white;
            padding: 22px 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 25px 30px;
        }
        
        /* Stats Dashboard Styling */
        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .stat-card p {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
        }

        .form-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            align-items: flex-end;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3b82f6;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add { background: #16a34a; color: white; }
        .btn-add:hover { background: #15803d; }
        .btn-mark { background: #2563eb; color: white; }
        .btn-mark:hover { background: #1d4ed8; }
        .btn-clear { background: #64748b; color: white; }
        .btn-clear:hover { background: #475569; }
        .btn-export { background: #7c3aed; color: white; }
        .btn-export:hover { background: #6d28d9; }
        .btn-delete { background: #dc2626; color: white; padding: 5px 10px; font-size: 12px; }

        /* Controls Section for Search & Export */
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-box {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            width: 250px;
            outline: none;
        }
        .search-box:focus {
            border-color: #3b82f6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #334155;
        }
        tr:hover {
            background: #f8fafc;
        }
        .status-present { color: #16a34a; font-weight: 600; }
        .status-absent { color: #dc2626; font-weight: 600; }
        .empty {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Attendance System</h1>
        </div>
        <div class="content">
            
            <!-- Statistics Dashboard -->
            <div class="stats-dashboard">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <p id="statTotal">0</p>
                </div>
                <div class="stat-card">
                    <h3>Present Today</h3>
                    <p id="statPresent" style="color: #16a34a;">0</p>
                </div>
                <div class="stat-card">
                    <h3>Absent Today</h3>
                    <p id="statAbsent" style="color: #dc2626;">0</p>
                </div>
            </div>

            <!-- Form Inputs -->
            <div class="form-section">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g. STU001">
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="studentName" placeholder="Student full name">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn-add" onclick="addStudent()">Add Student</button>
                    <button class="btn-mark" onclick="markAttendance()">Mark Attendance</button>
                    <button class="btn-clear" onclick="clearFields()">Clear</button>
                </div>
            </div>

            <!-- Action Controls & Search Filters -->
            <div class="table-controls">
                <input type="text" id="searchBox" class="search-box" placeholder="Search by name or ID..." oninput="renderTable()">
                <button class="btn-export" onclick="exportToCSV()">Export CSV</button>
            </div>

            <!-- Data Table -->
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Records here -->
                </tbody>
            </table>
            
            <div id="emptyMessage" class="empty" style="display: none;">
                No records found matching your query.
            </div>
        </div>
        <div class="footer">
            Simple Attendance System • Data saved in browser
        </div>
    </div>

    <script>
        // Load data from localStorage
        let students = JSON.parse(localStorage.getItem("attendanceData")) || [];

        function saveData() {
            localStorage.setItem("attendanceData", JSON.stringify(students));
            updateStats();
        }

        function updateStats() {
            const total = students.length;
            const present = students.filter(s => s.status === 'Present').length;
            const absent = students.filter(s => s.status === 'Absent').length;

            document.getElementById("statTotal").innerText = total;
            document.getElementById("statPresent").innerText = present;
            document.getElementById("statAbsent").innerText = absent;
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            const emptyMsg = document.getElementById("emptyMessage");
            const searchQuery = document.getElementById("searchBox").value.toLowerCase().trim();
            
            tbody.innerHTML = "";

            // Apply search filters
            const filteredStudents = students.filter(student => 
                student.id.toLowerCase().includes(searchQuery) || 
                student.name.toLowerCase().includes(searchQuery)
            );

            if (filteredStudents.length === 0) {
                emptyMsg.style.display = "block";
                updateStats();
                return;
            }
            
            emptyMsg.style.display = "none";
            
            filteredStudents.forEach((student) => {
                // Find original tracking index for proper deletion context
                const originalIndex = students.findIndex(s => s.id === student.id);
                
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
